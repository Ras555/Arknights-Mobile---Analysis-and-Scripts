[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arknights-calc"
version = "0.1.0"
description = "Arknights damage and stat calculations: operator stats, DPS, and stage matchups."
requires-python = ">=3.11"
dependencies = [
    "arkprts==0.3.22",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
# Development tools, pinned so pre-commit, CI and every machine give the same results.
dev = [
    "mutmut==3.8.1",
    "mypy==2.4.1",
    "pandas-stubs==3.0.5.260914",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[project.scripts]
arknights-calc = "arknights_calc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import the shared test data builders with `from factories import ...`.
pythonpath = ["tests"]

[tool.mutmut]
source_paths = ["src"]
# Informational log lines are skipped, since mutating their text doesn't change
# behaviour. Warnings, errors, print() and raise lines are still mutated.
do_not_mutate_patterns = ['logger\.info\(']

# ruff is used for linting only (no auto-formatting), so the code keeps its own layout.
[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle errors and warnings, F: pyflakes (unused imports, undefined names), I: import sorting,
# B: bugbear (likely bugs), UP: pyupgrade (outdated syntax), SIM: simplifications.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["arkdata", "arknights_calc", "factories"]

# Type checks src/ (the tests are not type checked).
[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

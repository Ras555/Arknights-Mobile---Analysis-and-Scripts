# Continuous integration for the project, run by GitHub Actions.
# - checks: lint (ruff), type check (mypy) and tests (pytest) on every push and pull request.
# - mutation-testing: mutmut on every push to main (after checks pass), or on demand from the
#   Actions tab ("Run workflow"). Results are shown in the run's summary and attached as an artifact.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project and dev tools
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check --output-format github
      - name: Type check (mypy)
        run: mypy
      - name: Test (pytest)
        run: pytest

  mutation-testing:
    name: Mutation testing
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the project and dev tools
        run: pip install -e ".[dev]"
      - name: Run mutmut
        run: mutmut run --max-children 4
      - name: Summarize results
        if: always()
        run: |
          mutmut results --all true > mutmut-results.txt || true
          {
            echo "## Mutation testing"
            echo ""
            echo "| Status | Mutants |"
            echo "|---|---|"
            sed 's/.*: //' mutmut-results.txt | sort | uniq -c | sed -E 's/^ *([0-9]+) (.*)$/| \2 | \1 |/'
            echo ""
            echo "### Surviving mutants"
            echo '```'
            grep ': survived' mutmut-results.txt | sed 's/^ *//' || echo "None"
            echo '```'
            echo "Inspect one locally (WSL or Linux) with: mutmut show <name>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-results
          path: mutmut-results.txt
 